# Run real temporary-repository tests and built-wheel smoke checks on hosted runners.
# No deployment or package publishing occurs; the token has read-only contents access.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Test ownership, messages, installation, and independent processes
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install built wheel without the network
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist agent-accord
      - name: Verify installed resources and standalone handoff
        run: python tests/smoke_package.py
